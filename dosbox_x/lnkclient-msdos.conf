# dosbox-x config: DOS-side LNKCLIENT (real MS-DOS 6.22 LNKCLIENT,
# acting as the LNKCLIENT *client* / redirector) talking over real
# serial hardware (/dev/ttyUSB0) to a Linux pyterlink-server on
# /dev/ttyUSB1, the other end of the same null-modem cable.
#
# Boots a real hard-drive image (dosbox_x/images/lnkclient-msdos.img)
# via IMGMOUNT + BOOT. The image has been customized so that
# C:\CONFIG.SYS contains:
#   DEVICE=C:\DOS\SETVER.EXE
#   DEVICE=C:\DOS\HIMEM.SYS
#   DEVICE=C:\DOS\INTERLNK.EXE /COM:1 /BAUD:115200 /V
#   DOS=HIGH
#   FILES=30
# so the LNKCLIENT device driver is loaded during the real boot
# sequence (before AUTOEXEC.BAT), which fixes the boot-order blocker
# documented in the older dosbox_x/lnkclient.conf.
#
# C:\AUTOEXEC.BAT on this image is the stock MS-DOS 6.22 one -- it
# sets prompt, PATH, TEMP, and runs SMARTDRV. LNKCLIENT is a
# device driver, not a TSR, so it is invoked from CONFIG.SYS and
# needs no AUTOEXEC entry. Once DOS has booted, the prompt should
# show this machine's drives AND one or more redirected drives from
# the peer (run `INTERLNK` from the prompt to see the "This Computer
# / Other Computer" status panel).
#
# Real hardware:
#   /dev/ttyUSB0 and /dev/ttyUSB1 are wired together with a
#   null-modem cable. This conf opens /dev/ttyUSB0 via dosbox's
#   directserial backend. Verified 2026-09-01: classic /usr/bin/dosbox
#   0.74-3 opens the port; the dosbox-x snap does not.
#
# Audio backends disabled (PC speaker only) per user request 2026-09-01.

[cpu]
core=dynamic
cputype=auto
cycles=fixed 40000

[serial]
serial1=nullmodem 127.0.0.1 port:11233 txdelay:0 rxdelay:0 transparent:1
serial2=directserial realport:ttyUSB1
serial3=nullmodem server:127.0.0.1 port:11430 txdelay:0 rxdelay:0 transparent:1
serial4=nullmodem server:127.0.0.1 port:11231 txdelay:0 rxdelay:0

[sblaster]
sbtype=none

[gus]
gus=false

[innova]
innova=false

[speaker]
pcspeaker=true
tandy=off
disney=false

[midi]
mpu401=none
mididevice=none

[autoexec]
# Defensively undo any C:/D: mount inherited from a personal default
# dosbox conf loaded ahead of this one (autoexec sections concatenate
# across multiple loaded confs -- see dosbox_x/README.md "Personal
# default dosbox conf conflicts"). No-op if nothing was mounted.
mount -u c
mount -u d
#imgmount 2 "/path/to/Pyterlink/dosbox_x/images/lnkclient-msdos.img" -t hdd -fs none -size 512,63,16,207
imgmount 2 "images/lnkclient-msdos.img" -t hdd -fs none -size 512,63,16,100
boot -l c
