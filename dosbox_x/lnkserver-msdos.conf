# dosbox-x config: DOS-side LNKSERVER (real MS-DOS 6.22 LNKSERVER,
# acting as the LNKCLIENT *server*) talking over real serial hardware
# (/dev/ttyUSB0) to the Linux side (pyterlink-server or the
# probe script) on /dev/ttyUSB1, the other end of the same null-modem
# cable.
#
# Boots a real hard-drive image (dosbox_x/images/lnkserver-msdos.img)
# rather than mounting a directory. The image has been customized so
# C:\CONFIG.SYS is the stock MS-DOS 6.22 set (no LNKCLIENT device
# driver) and C:\AUTOEXEC.BAT ends with
#   C:\DOS\INTERSVR.EXE C: /COM:1 /BAUD:115200 /V
# so the LNKSERVER program starts automatically at the DOS prompt.
#
# This is the same setup as the older dosbox_x/lnkserver.conf (which
# used [autoexec] mount c on a loose-file directory), but it now
# boots a real FAT16 partition via IMGMOUNT + BOOT. The real boot
# is what would let LNKCLIENT be a CONFIG.SYS device driver on
# the *client* side -- LNKSERVER is unaffected (it's a TSR, not a
# driver), but using IMGMOUNT here keeps the two confs symmetric
# and the rig future-proof if a real driver ever needs to be
# tested on the server side too.
#
# Real hardware:
#   /dev/ttyUSB0 and /dev/ttyUSB1 are wired together with a
#   null-modem cable. This conf opens /dev/ttyUSB0 via dosbox's
#   directserial backend. Verified 2026-09-01: classic /usr/bin/dosbox
#   0.74-3 opens the port; the dosbox-x snap does not (its strict
#   confinement has the serial-port / raw-usb plugs disconnected --
#   see dosbox_x/README.md "Snap confinement").
#
# Audio backends disabled (PC speaker only) per user request 2026-09-01.

[cpu]
core=dynamic
cputype=auto
cycles=fixed 40000

[serial]
serial1=nullmodem 127.0.0.1 port:11232 txdelay:0 rxdelay:0 transparent:1
serial2=directserial realport:ttyUSB0
serial3=nullmodem 127.0.0.1 port:11330 txdelay:0 rxdelay:0 transparent:1
serial4=nullmodem 127.0.0.1 port:11331 txdelay:0 rxdelay:0

[sblaster]
sbtype=none

[gus]
gus=false

[innova]
innova=false

[speaker]
pcspeaker=true
tandy=off
disney=false

[midi]
mpu401=none
mididevice=none

[autoexec]
# Defensively undo any C:/D: mount inherited from a personal default
# dosbox conf loaded ahead of this one (autoexec sections concatenate
# across multiple loaded confs -- see dosbox_x/README.md "Personal
# default dosbox conf conflicts"). No-op if nothing was mounted.
mount -u c
mount -u d
#imgmount 2 "/path/to/Pyterlink/dosbox_x/images/lnkserver-msdos.img" -t hdd -fs none -size 512,63,16,207
# A floppy for LNKSERVER's A: must be attached by BIOS drive number before
# boot (absolute path; DOSBox does not expand ~):
#imgmount 0 "/path/to/scratch.img" -t floppy -fs none
imgmount 2 "images/lnkserver-msdos.img" -t hdd -fs none -size 512,63,16,100
boot -l c
